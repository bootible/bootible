# yaml-language-server: $schema=https://raw.githubusercontent.com/bootible/bootible/main/schemas/device.schema.json
id: rog-ally
name: ROG Ally / Ally X
provisioning_models:
  - host-media-prep
  - on-device
os: windows
# Hardware whitelist — auto-detected only on a real Ally. RC71L = ROG Ally,
# RC72LA = ROG Ally X. Confirm the exact model string on-device if detection
# misses (the wizard shows what it read).
detect:
  manufacturer: ASUSTeK
  models:
    - RC71L
    - RC72LA
    - ROG Ally
capabilities:
  great:
    - nes
    - snes
    - genesis
    - gb
    - gbc
    - gba
    - n64
    - ps1
    - psp
    - dreamcast
    - gamecube
    - wii
    - ps2
  varies:
    - switch
    - ps3
    - wiiu
