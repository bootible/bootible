name: v2 CI

on:
  push:
    paths:
      - "packages/**"
      - "scripts/validate-schemas.ts"
      - "registry/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "biome.json"
      - ".github/workflows/v2-ci.yml"
  pull_request:
    paths:
      - "packages/**"
      - "scripts/validate-schemas.ts"
      - "registry/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "biome.json"
      - ".github/workflows/v2-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate:schemas
      - run: npm run -w @bootible/cli compile # single-file binary smoke build
