name: Update Checksums

on:
  push:
    branches: [main]
    paths:
      - 'targets/ally.ps1'
      - 'targets/deck.sh'
      - 'targets/android.sh'

jobs:
  update-checksums:
    name: Auto-update Checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate new checksums
        id: checksums
        run: |
          ALLY_HASH=$(sha256sum targets/ally.ps1 | cut -d' ' -f1)
          DECK_HASH=$(sha256sum targets/deck.sh | cut -d' ' -f1)
          ANDROID_HASH=$(sha256sum targets/android.sh | cut -d' ' -f1)

          echo "ally_hash=$ALLY_HASH" >> $GITHUB_OUTPUT
          echo "deck_hash=$DECK_HASH" >> $GITHUB_OUTPUT
          echo "android_hash=$ANDROID_HASH" >> $GITHUB_OUTPUT

          # Get current beta checksums from worker, scoped per route block.
          # The pattern "sha256: '" never matches the 'sha256Stable' field.
          ALLY_CURRENT=$(grep -A3 "'/rog':" cloudflare/_worker.js | grep -oP "sha256: '\K[a-f0-9]{64}")
          DECK_CURRENT=$(grep -A3 "'/deck':" cloudflare/_worker.js | grep -oP "sha256: '\K[a-f0-9]{64}")
          ANDROID_CURRENT=$(grep -A3 "'/android':" cloudflare/_worker.js | grep -oP "sha256: '\K[a-f0-9]{64}")

          if [ "$ALLY_HASH" != "$ALLY_CURRENT" ] || [ "$DECK_HASH" != "$DECK_CURRENT" ] || [ "$ANDROID_HASH" != "$ANDROID_CURRENT" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Update worker checksums
        if: steps.checksums.outputs.needs_update == 'true'
        run: |
          # Update only the beta 'sha256' field inside each route's block.
          # 'sha256Stable' is pinned by the release process (docs/releasing.md)
          # and must never be touched by this workflow.
          sed -i "/'\/rog':/,/}/ s/sha256: '[a-f0-9]\{64\}'/sha256: '${{ steps.checksums.outputs.ally_hash }}'/" cloudflare/_worker.js
          sed -i "/'\/deck':/,/}/ s/sha256: '[a-f0-9]\{64\}'/sha256: '${{ steps.checksums.outputs.deck_hash }}'/" cloudflare/_worker.js
          sed -i "/'\/android':/,/}/ s/sha256: '[a-f0-9]\{64\}'/sha256: '${{ steps.checksums.outputs.android_hash }}'/" cloudflare/_worker.js

      - name: Commit and push
        if: steps.checksums.outputs.needs_update == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cloudflare/_worker.js
          git commit -m "chore: auto-update script checksums

          ally.ps1: ${{ steps.checksums.outputs.ally_hash }}
          deck.sh: ${{ steps.checksums.outputs.deck_hash }}
          android.sh: ${{ steps.checksums.outputs.android_hash }}

          [skip ci]"
          git push
