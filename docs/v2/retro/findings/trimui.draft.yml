# DRAFT proposed registry entry for the TrimUI Brick — NOT yet live in
# registry/devices/ (that needs the host-media-prep executor + a firmware-options
# UI first). Schema-valid against schemas/device.schema.json. Versions are
# pinned at BUILD time, not here. Source: docs/v2/retro/findings/trimui-brick.md.
# yaml-language-server: $schema=https://raw.githubusercontent.com/bootible/bootible/main/schemas/device.schema.json
id: trimui-brick
name: TrimUI Brick / Brick Hammer
provisioning_models:
  - host-media-prep
# One microSD holds firmware + content (no OS/games split). FAT32+MBR default —
# exFAT corrupts over time on the Brick. >32 GB needs the "Large FAT32" path.
media:
  kind: microsd
  fs: fat32
firmware:
  default: nextui
  # v1 TrimUI scope = these THREE — they exercise every host-prep mechanic
  # (file-extract, image-flash, and stock's recovery+assets two-parter).
  options:
    nextui:
      name: NextUI
      method: extract            # copy files to card root
      source: github:LoveRetro/NextUI
      recommended: true
      notes: MinUI fork — WiFi, RetroAchievements, art scraping. Newcomer default.
    knulli:
      name: Knulli
      method: image               # dd/etcher; multi-partition; SHARE=exFAT (Gladiator+)
      source: github:knulli-cfw/distribution
      notes: Batocera family — EmulationStation, most capable. roms in /userdata/roms/<lowercase>. Verify Brick tier.
    stock:
      name: Default OS (TrimUI stock)
      method: image+extract       # .awimg recovery-flash + assets_brick SD package
      source: github:trimui/firmware_brick + github:trimui/assets_brick
      notes: Two parts, separate repos. assets package needs 7-Zip. Manufacturer baseline.
    # --- Deferred (each is the same mechanic as one above → pure data add later) ---
    # minui:  extract (like NextUI, more minimal)  — github:shauninman/MinUI
    # muos:   image   (like Knulli)                — muos.dev TUI-BRICK
    # crossmix/SunnyMix: not Brick-ready (v1.4.0 unreleased; SunnyMix beta)
# Default scaffold for the file-extract (MinUI/NextUI) family on a FAT32 card.
# Image firmwares (Knulli/muOS) define their own layout after flashing.
layout:
  dirs:
    - Roms
    - BIOS
    - Saves
capabilities:
  great:
    - nes
    - sms
    - gb
    - gbc
    - gba
    - snes
    - genesis
    - gamegear
    - ngp
    - atari2600
    - ps1
  varies:           # n64/psp: SoC marginal AND no analog sticks → "poor controls"
    - nds
    - dreamcast
    - n64
    - psp
  none:
    - saturn
    - ps2
    - gamecube
    - wii
guide: https://www.joeysretrohandhelds.com/guides/nextui-setup-guide/
notes: >-
  No analog sticks — N64/PSP rate "poor controls" even where the SoC copes (the
  Smart Pro, same SoC + sticks, rates them higher; consider a per-device control
  flag when implementing). Brick Hammer = identical board, metal shell — same
  firmware. NOT the same device as the "Brick Hammer Pro U" (Snapdragon/Android).
  Match firmware to model — cross-flashing bricks the device. Firmware versions
  drift; pin per build and re-verify. See docs/v2/retro/findings/trimui-brick.md.
  GROUT (RomM client, grout.romm.app) should be offered as an installable ENABLER
  per firmware (supports NextUI/Knulli/TrimUI) — bootible installs it; the user
  pulls their OWN games/BIOS/saves from their OWN RomM. Needs a new schema field
  (e.g. `enablers`) — not yet in device.schema.json.
